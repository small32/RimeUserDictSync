[package]
name = "rime-user-dict-sync"
version = "0.2.2"
edition = "2024"
description = "Cross-platform RIME user dictionary WebDAV synchronizer"
license = "GPL-3.0-only"

[[bin]]
name = "RimeUserDictSync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
filetime = "0.2"
httpdate = "1"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.15"
roxmltree = "0.20"
time = "0.3"
url = "2"
walkdir = "2"
zip = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
