name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.5.3 (must match its Cargo.toml)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先把 tag 与 Cargo.toml 的版本对齐，后面三个平台就不用各查一遍，
  # 也就不会出现「Windows 构建成功、macOS 才发现版本号不对」这种半截状态。
  resolve:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must match Cargo.toml version
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$PUSH_TAG"
          fi
          git check-ref-format "refs/tags/$TAG"
          COMMIT="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if [[ "$EVENT_NAME" == "push" && "$COMMIT" != "$(git rev-parse "$PUSH_SHA^{commit}")" ]]; then
            echo "标签 $TAG 已移动，与触发此次构建的提交不同" >&2
            exit 1
          fi
          VERSION="$(git show "$COMMIT:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Release tag $TAG 与 Cargo.toml 的版本 $VERSION 不一致" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "标签 $TAG 对应提交 $COMMIT，Cargo.toml 版本 $VERSION"

  windows:
    name: Windows x64
    needs: resolve
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Select Rust stable with fmt and clippy
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --release --locked

      # 单文件便携版：齿轮图标已经内嵌在 EXE 里（资源 ID 101），不需要额外带 .ico。
      - name: Stage Windows asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/RimeUserDictSync.exe `
            "dist/RimeUserDictSync-${{ needs.resolve.outputs.tag }}-Windows-x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ARM64 and Intel
    needs: resolve
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Select Rust stable and install targets
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # 这里同时也是「非 Windows 代码编不编得过」的守门人：
      # service / shortcut 两个模块只在 Windows 上编译，别处引用到就会在这一步炸掉。
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build and package macOS applications
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x86_64
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Select Rust stable with fmt and clippy
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      # eframe 走 X11/Wayland，rfd 的 GTK3 后端要 gtk+-3.0.pc：
      # 缺这几个 -dev 包时，pkg-config 会在编译期直接报 "system library not found"。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      # 这一步同时是「Linux 专属模块能不能编」的守门人：
      # picker_linux / service_linux / shortcut_linux 只在 Linux 上编译。
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Stage Linux asset
        run: |
          mkdir -p dist
          cp target/release/RimeUserDictSync \
            "dist/RimeUserDictSync-${{ needs.resolve.outputs.tag }}-Linux-x86_64"
          chmod +x "dist/RimeUserDictSync-${{ needs.resolve.outputs.tag }}-Linux-x86_64"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish one GitHub Release
    needs:
      - resolve
      - windows
      - macos
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # RELEASE_NOTES.md 是累计式的（新版本段落加在最上面）。Release 正文只取
      # 顶部这一段，排除版本标题，避免带入其他版本的历史说明。
      - name: Keep only this version's notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path("RELEASE_NOTES.md").read_text(encoding="utf-8").splitlines()
          if not lines or lines[0] != "# " + os.environ["RELEASE_TAG"]:
              raise SystemExit("发布说明标题与标签不一致")
          body = []
          for line in lines[1:]:
              if line.startswith("# v"):
                  break
              body.append(line)
          notes = "\n".join(body).strip()
          if not notes:
              raise SystemExit("发布说明不能为空")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(notes)
          PY

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "RimeUserDictSync $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
